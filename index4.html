                <h2>Frank Ocean</h2>
                <figure>
                    <img src="./bilder/image copy 7.png" alt="">
                    <figcaption>Frank Ocean is an American singer, songwriter, and producer known for blending R&B,
                        soul, hip hop, and experimental pop. He is widely considered one of the most influential artists
                        in modern alternative R&B. He was born Christopher Edwin Breaux in 1987 in Long Beach and grew
                        up in New Orleans. After
                        Hurricane Katrina, he moved to Los Angeles to pursue music more seriously. Frank Ocean first
                        worked behind the scenes as a songwriter for artists such as Beyoncé, Justin
                        Bieber, and John Legend. He later became known as part of the hip hop collective Odd Future
                        alongside artists like Tyler, the Creator.</figcaption>
                </figure>
            </article>

            <article>
                <h2>Blonde</h2>
                <figure>
                    <img src="./bilder/image copy 8.png" alt="">
                    <figcaption>Blonde är det andra studioalbumet av Frank Ocean och släpptes år 2016. Albumet är känt
                        för sina känslosamma berättelser, experimentella ljud och väldigt personliga texter. Många
                        musikkritiker ser det som ett av de bästa albumen från 2010-talet. Till skillnad från vanliga pop- eller R&B-album har Blonde en mjuk, drömlik och ibland nästan
                        splittrad stil. Låtarna förändras ofta mitt i, har väldigt lite trummor och fokuserar mer på
                        känsla och atmosfär än på stora refränger.</figcaption>
                </figure>
            </article>
