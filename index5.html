                <h2>Tyler, The creator</h2>
                <figure>
                    <img src="./bilder/image copy 9.png" alt="">
                    <figcaption>Tyler, The Creator är en amerikansk artist, producent och designer som är känd för att
                        hela tiden förändra sitt sound och sin stil. Han började med aggressiv och kaotisk rap men
                        utvecklades senare till att göra mer personliga och kreativa album med influenser från jazz,
                        soul, funk och alternativ hiphop. Det som gör Tyler speciell är hur mycket personlighet och
                        detaljer han lägger i sin musik, från
                        produktion och texter till hela estetiken runt albumen. Hans projekt känns ofta som egna världar
                        med tydliga teman och starka känslor bakom dem.</figcaption>
                </figure>

            </article>

            <article>
                <h2>Flower Boy</h2>

                <figure>
                    <img src="./bilder/image copy 10.png" alt="">
                    <figcaption>Flower Boy är ofta sett som albumet där Tyler, The Creator verkligen utvecklades som
                        artist. Det blandar alternativ hiphop, jazz, soul och funk på ett väldigt mjukt och genomtänkt
                        sätt, samtidigt som texterna känns mycket mer personliga och emotionella än hans tidigare musik.
                        Det som gör albumet speciellt är hur varmt och färgglatt soundet känns, med stora synthar,
                        melodiska refränger och lugna produktioner som nästan flyter ihop som en enda lång resa. Låtar
                        som “See You Again”</figcaption>
                </figure>

            </article>
